<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="340" viewBox="0 0 1200 340">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b0f1a"/>
      <stop offset="1" stop-color="#111827"/>
    </linearGradient>
    <radialGradient id="b1" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#3b5bff" stop-opacity="0.85"/>
      <stop offset="1" stop-color="#3b5bff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="b2" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ff5a1f" stop-opacity="0.75"/>
      <stop offset="1" stop-color="#ff5a1f" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="b3" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#c6e36b" stop-opacity="0.6"/>
      <stop offset="1" stop-color="#c6e36b" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="title" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.55" stop-color="#dfe6ff"/>
      <stop offset="1" stop-color="#8ea2ff"/>
    </linearGradient>
    <linearGradient id="shine" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#fff" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#fff" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#ffffff" stroke-opacity="0.05"/>
    </pattern>
    <clipPath id="clip"><rect width="1200" height="340" rx="22"/></clipPath>
    <clipPath id="tclip"><text x="70" y="168" font-size="104" font-weight="900" letter-spacing="-3">CHOPA4OK</text></clipPath>
  </defs>
  <style>
    text { font-family: 'Segoe UI', Inter, Roboto, 'Helvetica Neue', Arial, sans-serif; }
    .mono { font-family: 'Cascadia Code', 'JetBrains Mono', Consolas, 'Courier New', monospace; }
    @keyframes f1 { 0%,100% { transform: translate(0,0) } 50% { transform: translate(60px,30px) } }
    @keyframes f2 { 0%,100% { transform: translate(0,0) } 50% { transform: translate(-70px,-20px) } }
    @keyframes f3 { 0%,100% { transform: translate(0,0) } 50% { transform: translate(-40px,35px) } }
    @keyframes sweep { 0% { transform: translateX(-500px) } 60%,100% { transform: translateX(1100px) } }
    @keyframes blink { 0%,49% { opacity: 1 } 50%,100% { opacity: 0 } }
    @keyframes rise { from { opacity: 0; transform: translateY(14px) } to { opacity: 1; transform: translateY(0) } }
    @keyframes spin { to { transform: rotate(360deg) } }
    @keyframes dash { to { stroke-dashoffset: -400 } }
    @keyframes pulse { 0%,100% { opacity: .35 } 50% { opacity: 1 } }
    .b1 { animation: f1 11s ease-in-out infinite; }
    .b2 { animation: f2 13s ease-in-out infinite; }
    .b3 { animation: f3 9s ease-in-out infinite; }
    .sweep { animation: sweep 6s ease-in-out infinite; }
    .cur { animation: blink 1s steps(1) infinite; }
    .r1 { animation: rise .9s ease-out both; }
    .r2 { animation: rise .9s .25s ease-out both; }
    .r3 { animation: rise .9s .5s ease-out both; }
    .orbit { transform-origin: 1010px 170px; animation: spin 26s linear infinite; }
    .orbit2 { transform-origin: 1010px 170px; animation: spin 40s linear infinite reverse; }
    .dash { stroke-dasharray: 6 10; animation: dash 8s linear infinite; }
    .dot { animation: pulse 2.4s ease-in-out infinite; }
  </style>

  <g clip-path="url(#clip)">
    <rect width="1200" height="340" fill="url(#bg)"/>
    <rect width="1200" height="340" fill="url(#grid)"/>
    <circle class="b1" cx="230" cy="40" r="260" fill="url(#b1)"/>
    <circle class="b2" cx="1080" cy="300" r="240" fill="url(#b2)"/>
    <circle class="b3" cx="760" cy="-20" r="200" fill="url(#b3)"/>

    <!-- orbit decoration -->
    <g opacity="0.9">
      <circle cx="1010" cy="170" r="118" fill="none" stroke="#ffffff" stroke-opacity="0.14"/>
      <circle class="dash" cx="1010" cy="170" r="84" fill="none" stroke="#c6e36b" stroke-opacity="0.6" stroke-width="1.5"/>
      <g class="orbit">
        <circle cx="1128" cy="170" r="7" fill="#ff5a1f"/>
        <circle cx="892" cy="170" r="4" fill="#ffffff" opacity=".7"/>
      </g>
      <g class="orbit2">
        <circle cx="1010" cy="86" r="5" fill="#3b5bff"/>
      </g>
      <rect x="966" y="126" width="88" height="88" rx="20" fill="#0b0f1a" stroke="#ffffff" stroke-opacity="0.18"/>
      <text x="1010" y="183" text-anchor="middle" class="mono" font-size="34" font-weight="700" fill="#c6e36b">&lt;/&gt;</text>
    </g>

    <!-- text -->
    <g class="r1">
      <circle class="dot" cx="78" cy="78" r="6" fill="#c6e36b"/>
      <text x="94" y="84" class="mono" font-size="17" fill="#c9d1e3" letter-spacing="2">FULLSTACK WEB DEVELOPER · KAZAKHSTAN</text>
    </g>
    <g class="r2">
      <text x="70" y="168" font-size="104" font-weight="900" letter-spacing="-3" fill="url(#title)">CHOPA4OK</text>
      <g clip-path="url(#tclip)"><rect class="sweep" x="0" y="60" width="220" height="140" fill="url(#shine)" transform="skewX(-20)"/></g>
    </g>
    <g class="r3">
      <text x="72" y="222" font-size="26" fill="#e6ebf7" font-weight="600">Асет Казияхметов</text>
      <text x="72" y="262" class="mono" font-size="19" fill="#9aa6c2">
        <tspan fill="#ff7a45">$</tspan> 1С-Битрикс · WordPress · PHP · Go · React · техническое SEO<tspan class="cur" fill="#c6e36b"> ▍</tspan>
      </text>
    </g>
    <rect x="0" y="336" width="1200" height="4" fill="#3b5bff"/>
    <rect x="0" y="336" width="420" height="4" fill="#ff5a1f"/>
    <rect x="420" y="336" width="220" height="4" fill="#c6e36b"/>
  </g>
</svg>
