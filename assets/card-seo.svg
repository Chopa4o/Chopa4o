<svg xmlns="http://www.w3.org/2000/svg" width="590" height="330" viewBox="0 0 590 330">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1a0f10"/><stop offset="1" stop-color="#0e1018"/>
    </linearGradient>
    <radialGradient id="glow" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#e3342f" stop-opacity=".55"/><stop offset="1" stop-color="#e3342f" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="c"><rect width="590" height="330" rx="20"/></clipPath>
  </defs>
  <style>
    text { font-family: 'Segoe UI', Inter, Roboto, Arial, sans-serif; }
    .m { font-family: 'Cascadia Code', 'JetBrains Mono', Consolas, monospace; }
    @keyframes prog { 0% { width: 0 } 70% { width: 230px } 100% { width: 230px } }
    @keyframes scroll { 0% { transform: translateY(0) } 100% { transform: translateY(-120px) } }
    @keyframes floaty { 0%,100% { transform: translate(0,0) } 50% { transform: translate(-20px,15px) } }
    .p { animation: prog 4s ease-in-out infinite; }
    .s { animation: scroll 6s linear infinite; }
    .gl { animation: floaty 8s ease-in-out infinite; }
  </style>
  <g clip-path="url(#c)">
    <rect width="590" height="330" fill="url(#g)"/>
    <circle class="gl" cx="520" cy="40" r="170" fill="url(#glow)"/>
    <rect x=".5" y=".5" width="589" height="329" rx="20" fill="none" stroke="#ffffff" stroke-opacity=".1"/>

    <text x="32" y="50" class="m" font-size="13" fill="#ff8f86" letter-spacing="2">WINDOWS · GO · WAILS</text>
    <text x="32" y="96" font-size="38" font-weight="800" fill="#fff">Chopa<tspan fill="#ff4b42">SEO</tspan></text>
    <text x="32" y="128" font-size="16.5" fill="#c3c9d8">Технический аудит сайта: ошибки,</text>
    <text x="32" y="150" font-size="16.5" fill="#c3c9d8">приоритеты и план исправлений</text>

    <g font-size="12.5" class="m">
      <rect x="32" y="176" width="44" height="26" rx="13" fill="#ffffff" fill-opacity=".08"/><text x="54" y="193.5" text-anchor="middle" fill="#e8ecf6">Go</text>
      <rect x="84" y="176" width="62" height="26" rx="13" fill="#ffffff" fill-opacity=".08"/><text x="115" y="193.5" text-anchor="middle" fill="#e8ecf6">Wails</text>
      <rect x="154" y="176" width="58" height="26" rx="13" fill="#ffffff" fill-opacity=".08"/><text x="183" y="193.5" text-anchor="middle" fill="#e8ecf6">DOCX</text>
      <rect x="220" y="176" width="56" height="26" rx="13" fill="#ffffff" fill-opacity=".08"/><text x="248" y="193.5" text-anchor="middle" fill="#e8ecf6">XLSX</text>
    </g>

    <text x="32" y="240" class="m" font-size="13" fill="#9aa3b8">crawling…</text>
    <rect x="32" y="250" width="230" height="8" rx="4" fill="#ffffff" fill-opacity=".08"/>
    <rect class="p" x="32" y="250" width="0" height="8" rx="4" fill="#ff4b42"/>
    <text x="32" y="292" font-size="14" fill="#c3c9d8">v5.1.3 · seo.chopa4ok.space</text>

    <!-- log window -->
    <rect x="320" y="40" width="240" height="250" rx="14" fill="#07090f" stroke="#ffffff" stroke-opacity=".1"/>
    <circle cx="340" cy="60" r="5" fill="#ff5f57"/><circle cx="356" cy="60" r="5" fill="#febc2e"/><circle cx="372" cy="60" r="5" fill="#28c840"/>
    <svg x="320" y="76" width="240" height="204">
      <g class="s m" font-size="12.5">
        <text x="16" y="22" fill="#28c840">200</text><text x="52" y="22" fill="#aab3c7">/catalog/</text>
        <text x="16" y="46" fill="#febc2e">301</text><text x="52" y="46" fill="#aab3c7">/old-page → /new</text>
        <text x="16" y="70" fill="#28c840">200</text><text x="52" y="70" fill="#aab3c7">/about/</text>
        <text x="16" y="94" fill="#ff5f57">404</text><text x="52" y="94" fill="#aab3c7">/promo-2023/</text>
        <text x="16" y="118" fill="#8ea2ff">dup</text><text x="52" y="118" fill="#aab3c7">title × 12 pages</text>
        <text x="16" y="142" fill="#28c840">200</text><text x="52" y="142" fill="#aab3c7">/contacts/</text>
        <text x="16" y="166" fill="#ff5f57">noidx</text><text x="66" y="166" fill="#aab3c7">sitemap URL</text>
        <text x="16" y="190" fill="#28c840">200</text><text x="52" y="190" fill="#aab3c7">/services/</text>
        <text x="16" y="214" fill="#febc2e">psi</text><text x="52" y="214" fill="#aab3c7">LCP 3.9s mobile</text>
        <text x="16" y="238" fill="#28c840">200</text><text x="52" y="238" fill="#aab3c7">/catalog/</text>
        <text x="16" y="262" fill="#febc2e">301</text><text x="52" y="262" fill="#aab3c7">/old-page → /new</text>
        <text x="16" y="286" fill="#28c840">200</text><text x="52" y="286" fill="#aab3c7">/about/</text>
        <text x="16" y="310" fill="#ff5f57">404</text><text x="52" y="310" fill="#aab3c7">/promo-2023/</text>
        <text x="16" y="334" fill="#8ea2ff">dup</text><text x="52" y="334" fill="#aab3c7">title × 12 pages</text>
      </g>
    </svg>
  </g>
</svg>
