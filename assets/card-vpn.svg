<svg xmlns="http://www.w3.org/2000/svg" width="590" height="330" viewBox="0 0 590 330">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0c1230"/><stop offset="1" stop-color="#0b0f18"/>
    </linearGradient>
    <radialGradient id="glow" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#3b5bff" stop-opacity=".6"/><stop offset="1" stop-color="#3b5bff" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="c"><rect width="590" height="330" rx="20"/></clipPath>
  </defs>
  <style>
    text { font-family: 'Segoe UI', Inter, Roboto, Arial, sans-serif; }
    .m { font-family: 'Cascadia Code', 'JetBrains Mono', Consolas, monospace; }
    @keyframes ring { 0% { r: 30; opacity: .8 } 100% { r: 95; opacity: 0 } }
    @keyframes knob { 0%,40% { transform: translateX(0) } 50%,90% { transform: translateX(36px) } 100% { transform: translateX(0) } }
    @keyframes tog { 0%,40% { fill: #2a3046 } 50%,90% { fill: #3b5bff } 100% { fill: #2a3046 } }
    @keyframes flow { to { stroke-dashoffset: -60 } }
    @keyframes ping { 0%,100% { opacity: 1 } 50% { opacity: .55 } }
    .r1 { animation: ring 2.6s ease-out infinite; }
    .r2 { animation: ring 2.6s 1.3s ease-out infinite; }
    .k { animation: knob 5s ease-in-out infinite; }
    .t { animation: tog 5s ease-in-out infinite; }
    .f { stroke-dasharray: 4 8; animation: flow 1.6s linear infinite; }
    .pg { animation: ping 2s ease-in-out infinite; }
  </style>
  <g clip-path="url(#c)">
    <rect width="590" height="330" fill="url(#g)"/>
    <circle cx="450" cy="160" r="200" fill="url(#glow)"/>
    <rect x=".5" y=".5" width="589" height="329" rx="20" fill="none" stroke="#ffffff" stroke-opacity=".1"/>

    <text x="32" y="50" class="m" font-size="13" fill="#8ea2ff" letter-spacing="2">WINDOWS · ANDROID · GO</text>
    <text x="32" y="96" font-size="38" font-weight="800" fill="#fff">Chopa<tspan fill="#5b7bff">VPN</tspan></text>
    <text x="32" y="128" font-size="16.5" fill="#c3c9d8">VPN-сервис: свой backend, клиенты</text>
    <text x="32" y="150" font-size="16.5" fill="#c3c9d8">для Windows и Android, автообновление</text>

    <g font-size="12.5" class="m">
      <rect x="32" y="176" width="44" height="26" rx="13" fill="#ffffff" fill-opacity=".08"/><text x="54" y="193.5" text-anchor="middle" fill="#e8ecf6">Go</text>
      <rect x="84" y="176" width="64" height="26" rx="13" fill="#ffffff" fill-opacity=".08"/><text x="116" y="193.5" text-anchor="middle" fill="#e8ecf6">React</text>
      <rect x="156" y="176" width="56" height="26" rx="13" fill="#ffffff" fill-opacity=".08"/><text x="184" y="193.5" text-anchor="middle" fill="#e8ecf6">Java</text>
      <rect x="220" y="176" width="88" height="26" rx="13" fill="#ffffff" fill-opacity=".08"/><text x="264" y="193.5" text-anchor="middle" fill="#e8ecf6">Postgres</text>
    </g>

    <g font-size="13.5" fill="#c3c9d8">
      <text x="32" y="240">✓ Ed25519-подпись обновлений</text>
      <text x="32" y="264">✓ Kill switch · Hysteria2 · Xray</text>
      <text x="32" y="288">✓ ~530 автотестов</text>
    </g>

    <!-- shield + rings -->
    <circle class="r1" cx="450" cy="150" r="30" fill="none" stroke="#5b7bff" stroke-width="2"/>
    <circle class="r2" cx="450" cy="150" r="30" fill="none" stroke="#5b7bff" stroke-width="2"/>
    <path d="M450 104 L488 118 V150 C488 176 471 194 450 202 C429 194 412 176 412 150 V118 Z" fill="#101833" stroke="#5b7bff" stroke-width="2.5"/>
    <path d="M434 151 L446 163 L468 139" fill="none" stroke="#c6e36b" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/>

    <text x="450" y="244" class="m pg" text-anchor="middle" font-size="20" font-weight="700" fill="#fff" letter-spacing="3">PROTECTED</text>
    <rect class="t" x="414" y="264" width="72" height="36" rx="18" fill="#2a3046"/>
    <circle class="k" cx="432" cy="282" r="13" fill="#ffffff"/>
  </g>
</svg>
