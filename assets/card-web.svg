<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#151a10"/><stop offset=".55" stop-color="#0e1118"/><stop offset="1" stop-color="#1b100c"/>
    </linearGradient>
    <clipPath id="c"><rect width="1200" height="300" rx="20"/></clipPath>
    <clipPath id="scr"><rect x="660" y="64" width="480" height="206" rx="4"/></clipPath>
  </defs>
  <style>
    text { font-family: 'Segoe UI', Inter, Roboto, Arial, sans-serif; }
    .m { font-family: 'Cascadia Code', 'JetBrains Mono', Consolas, monospace; }
    @keyframes page { 0%,15% { transform: translateY(0) } 45%,60% { transform: translateY(-150px) } 90%,100% { transform: translateY(0) } }
    @keyframes cur { 0%,100% { transform: translate(0,0) } 30% { transform: translate(-120px,40px) } 60% { transform: translate(60px,-20px) } }
    @keyframes hl { 0%,100% { opacity: .25 } 50% { opacity: 1 } }
    .pg { animation: page 9s ease-in-out infinite; }
    .cu { animation: cur 7s ease-in-out infinite; }
    .h { animation: hl 3s ease-in-out infinite; }
  </style>
  <g clip-path="url(#c)">
