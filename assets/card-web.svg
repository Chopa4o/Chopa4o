    <rect x=".5" y=".5" width="1199" height="299" rx="20" fill="none" stroke="#ffffff" stroke-opacity=".1"/>

    <text x="40" y="58" class="m" font-size="13" fill="#c6e36b" letter-spacing="2">1С-БИТРИКС · WORDPRESS · HTML/CSS/JS · NODE.JS</text>
