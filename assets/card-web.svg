        <rect x="660" y="104" width="250" height="26" rx="4" fill="#1d1f26"/>
        <rect x="660" y="136" width="200" height="26" rx="4" fill="#3b5bff"/>
        <rect x="660" y="172" width="230" height="8" rx="3" fill="#9a958b"/><rect x="660" y="186" width="190" height="8" rx="3" fill="#9a958b"/>
        <rect x="660" y="206" width="110" height="28" rx="4" fill="#1d1f26"/>
