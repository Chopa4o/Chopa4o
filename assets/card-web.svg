    <!-- browser mock -->
    <rect x="640" y="30" width="520" height="252" rx="14" fill="#f2ede3"/>
    <rect x="640" y="30" width="520" height="30" rx="14" fill="#1d1f26"/>
    <rect x="640" y="46" width="520" height="14" fill="#1d1f26"/>
    <circle cx="660" cy="45" r="5" fill="#ff5f57"/><circle cx="676" cy="45" r="5" fill="#febc2e"/><circle cx="692" cy="45" r="5" fill="#28c840"/>
    <rect x="712" y="37" width="300" height="16" rx="8" fill="#2c2f38"/>
    <text x="724" y="49" class="m" font-size="10.5" fill="#9aa3b8">chopa4ok.space/portfolio</text>
    <g clip-path="url(#scr)">
